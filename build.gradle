plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.9.0"
}

group 'cn.litx'
version = findProperty('version') ?: '1.3.0'

repositories {
    mavenCentral()
}

dependencies {
    // Compile against the minimum supported Halo API so newer Halo versions stay compatible.
    implementation platform('run.halo.tools.platform:plugin:2.21.0')
    compileOnly 'run.halo.app:api'

    implementation('com.github.oshi:oshi-core:6.8.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('processResources') {
    // Bundle the project license and third-party dependency notices into the plugin JAR.
    from('LICENSE')
    from('NOTICE')
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('check') {
    dependsOn project(':ui').tasks.named('check')
}

halo {
    version = '2.27'
}
